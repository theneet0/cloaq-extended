name: Build and Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Extract version from manifest.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Package extension as zip
        run: |
          cd build
          zip -r ../cloaq-extended.zip ./*
          cd ..

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "Cloaq Extended ${{ steps.get_version.outputs.TAG }}"
          body: |
            ## Cloaq Extended ${{ steps.get_version.outputs.TAG }}

            Automated production build and package generated by GitHub Actions.

            ### Highlights
            * **Continuous VPN IP Tracking:** Real-time background detection of public IP changes with dynamic synchronization across active and future tabs.
            * **Browser & Network Locale Spoofing:** Dynamic `Accept-Language` HTTP header rewriting and native WebIDL `Navigator.prototype` emulation.
            * **Stealth Hardware Keyboard Emulation:** W3C Keyboard Map API (`navigator.keyboard.getLayoutMap()`) synthesis with native function masking and zero own-property prototype fidelity.
            * **Anti-Fingerprinting Protections:** Native `Function.prototype.toString` masking resistant to CreepJS and anti-bot verification suites.

            ---

            ### Installation Instructions
            1. Download `cloaq-extended.zip` from Assets below.
            2. Extract the archive contents to a local folder.
            3. Open Google Chrome (or Chromium-based browser) and navigate to `chrome://extensions/`.
            4. Enable **Developer mode** in the upper-right corner.
            5. Click **Load unpacked** and select the extracted folder.
            6. Pin Cloaq Extended and select **Match IP Address** in Configuration.
          files: cloaq-extended.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
